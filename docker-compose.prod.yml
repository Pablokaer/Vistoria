# Production stack (see README → Production deployment):
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
#
#   caddy          → the only service published on the host (80/443, automatic HTTPS for SITE_ADDRESS);
#                    /api/* and /health go straight to the API, everything else to the web app
#   web, api, db   → reachable only on the internal network
#
# A standalone file on purpose, not an override of docker-compose.yml: nothing from the development file
# (Development environment, demo seed, dev-only secrets, published database) can leak in through a
# forgotten -f. Every secret is required; compose refuses to start and names the missing variable (ADR 0024).
name: olhai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inspectflow}
      POSTGRES_USER: ${POSTGRES_USER:-inspectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -base64 32)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspectflow} -d ${POSTGRES_DB:-inspectflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_CONNECTION_STRING: "Host=db;Port=5432;Database=${POSTGRES_DB:-inspectflow};Username=${POSTGRES_USER:-inspectflow};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 random characters (openssl rand -base64 48)}
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:?set STORAGE_SIGNING_KEY to at least 32 random characters (openssl rand -base64 48)}
      STORAGE_PROVIDER: Local
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL to the public address, e.g. https://app.example.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_PROVIDER: ${AI_PROVIDER:-Auto}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-Auto}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      # One API instance, so migrations at start-up keep the schema in step with the image (ADR 0024).
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
      SEED_DEMO_DATA: "false"
      # X-Forwarded-For is believed only from the Caddy container below (fixed address).
      TRUST_FORWARDED_HEADERS: "true"
      TRUSTED_PROXIES: ${CADDY_IP:-172.30.250.10}
    volumes:
      - storage:/data/storage
    networks:
      - internal

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain (e.g. app.example.com) or ":80" behind another TLS terminator}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: ${CADDY_IP:-172.30.250.10}

networks:
  internal:
    ipam:
      config:
        # Fixed so the proxy keeps the address the API trusts; change both if it clashes with a local network.
        - subnet: ${INTERNAL_SUBNET:-172.30.250.0/24}

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
